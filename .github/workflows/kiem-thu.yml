# Kiểm thử tự động trên GitHub mỗi lần đẩy mã / mở PR.
# Chạy cú pháp, hồi quy, xung đột A/B và giao diện (kể cả ngoại tuyến),
# trên PostgreSQL 16 dựng tạm và Google Chrome có sẵn của máy chạy GitHub — không đụng CSDL thật.
name: Kiem thu

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: kiem-thu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kiem-thu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Khóa ký phiên đăng nhập chỉ dùng cho lượt chạy này (backend từ chối chạy khi thiếu).
      JWT_SECRET: ci-only-${{ github.run_id }}-${{ github.run_attempt }}-khong-dung-o-may-that
      TEST_DB_URL: postgres://postgres:postgres@127.0.0.1:5434/vina_regr_ci
      CONFLICT_TEST_DB_URL: postgres://postgres:postgres@127.0.0.1:5434/vina_reg_conflict_ci
      PERMISSION_TEST_DB_URL: postgres://postgres:postgres@127.0.0.1:5434/vina_reg_permissions_ci
      UI_TEST_DB_URL: postgres://postgres:postgres@127.0.0.1:5434/vina_ui_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: backend
      - name: Cu phap giao dien + build khop
        run: node backend/scripts/check-frontend.js
      - name: Kiem bo tach js/
        run: node --test backend/tests/jsUnits.test.js
        working-directory: .
      - name: Hoi quy (API + CSDL)
        if: ${{ !cancelled() }}
        run: |
          mkdir -p tests/ci-results
          if node --test --test-reporter=spec tests/regression.test.js > tests/ci-results/regression.txt 2>&1; then result=0; else result=$?; fi
          cat tests/ci-results/regression.txt
          node scripts/report-ci.js tests/ci-results/regression.txt regression "$result"
          exit "$result"
        working-directory: backend
      - name: Xung dot A/B va luu dong thoi (4 bang)
        if: ${{ !cancelled() }}
        run: |
          mkdir -p tests/ci-results
          if node --test --test-reporter=spec tests/concurrency.test.js > tests/ci-results/concurrency.txt 2>&1; then result=0; else result=$?; fi
          cat tests/ci-results/concurrency.txt
          node scripts/report-ci.js tests/ci-results/concurrency.txt concurrency "$result"
          exit "$result"
        working-directory: backend
      - name: Phan quyen theo vai tro - Viec 4 (API, DB rieng)
        if: ${{ !cancelled() }}
        run: |
          mkdir -p tests/ci-results
          if node --test --test-reporter=spec tests/permissions.test.js > tests/ci-results/permissions.txt 2>&1; then result=0; else result=$?; fi
          cat tests/ci-results/permissions.txt
          node scripts/report-ci.js tests/ci-results/permissions.txt permissions "$result"
          exit "$result"
        working-directory: backend
      - name: Giao dien (Chrome khong man hinh)
        if: ${{ !cancelled() }}
        run: |
          mkdir -p tests/ci-results
          if node --test --test-reporter=spec tests/ui/all.test.js > tests/ci-results/ui.txt 2>&1; then result=0; else result=$?; fi
          cat tests/ci-results/ui.txt
          node scripts/report-ci.js tests/ci-results/ui.txt ui "$result"
          exit "$result"
        working-directory: backend
      - name: Luu ket qua tung bo va anh loi giao dien
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backend/tests/ci-results/
            backend/tests/ui-artifacts/
          if-no-files-found: ignore
